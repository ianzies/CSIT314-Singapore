{% extends "base.html" %}

{% block content %}
<h2>Create Job Posting</h2>

<p>Enter job details so candidates can search and match with this role.</p>

<form method="POST">
    <label>Job Title:</label><br>
    <input type="text" name="job_title" required><br><br>

    <label>Job Description:</label><br>
    <textarea name="job_description" rows="4"></textarea><br><br>

    <label>Required Education Level:</label><br>
    <select name="required_education" required>
        <option value="">Select required education level</option>
        <option value="Diploma">Diploma</option>
        <option value="Bachelor">Bachelor</option>
        <option value="Master">Master</option>
        <option value="Doctorate">Doctorate</option>
        <option value="Other">Other</option>
    </select><br><br>

    <label>Required Skills:</label><br>
    <textarea name="required_skills" rows="4" placeholder="Example: Python, SQL, machine learning"></textarea><br><br>

    <label>Years of Experience Required:</label><br>
    <input type="number" name="years_experience_required" min="0" value="0"><br><br>

    <label>Work Mode:</label><br>
    <select name="work_mode">
        <option value="Remote">Remote</option>
        <option value="Hybrid">Hybrid</option>
        <option value="On-site">On-site</option>
    </select><br><br>

    <label>Job Location:</label><br>
    <input type="text" name="job_location"><br><br>

    <label>Annual Salary Range:</label><br>
    <select name="salary_range" required>
        <option value="">Select annual salary range</option>
        <option value="$40,000 - $50,000">$40,000 - $50,000</option>
        <option value="$50,000 - $60,000">$50,000 - $60,000</option>
        <option value="$60,000 - $70,000">$60,000 - $70,000</option>
        <option value="$70,000 - $80,000">$70,000 - $80,000</option>
        <option value="$80,000 - $100,000">$80,000 - $100,000</option>
        <option value="$100,000 - $120,000">$100,000 - $120,000</option>
        <option value="$120,000+">$120,000+</option>
    </select><br><br>

    <label>Job Type:</label><br>
    <select name="job_type">
        <option value="Full-time">Full-time</option>
        <option value="Part-time">Part-time</option>
        <option value="Internship">Internship</option>
        <option value="Contract">Contract</option>
    </select><br><br>

    <button type="submit">Create Job Posting</button>
</form>
{% endblock %}
